name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔨 Build production app
        run: npm run build

      - name: 🚀 Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project mahal-a8800 --non-interactive
          else
            echo "::error::FIREBASE_TOKEN secret is not found. Please add FIREBASE_TOKEN in GitHub Repository Settings -> Secrets and variables -> Actions"
            exit 1
          fi
